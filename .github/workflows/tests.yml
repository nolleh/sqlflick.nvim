name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  neovim:
    name: Neovim / ${{ matrix.neovim }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        neovim: [v0.10.4, stable]
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes curl git make
      - name: Install Neovim
        uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        with:
          neovim: true
          version: ${{ matrix.neovim }}
      - name: Install Plenary
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: nvim-lua/plenary.nvim
          ref: 74b06c6c75e4eeb3108ec01852001636d85a932b
          path: .deps/plenary.nvim
          persist-credentials: false
      - name: Run plugin tests
        run: |
          nvim --version
          make test

  backend:
    name: Go / race
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install C toolchain for SQLite and race tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential
      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
          cache-dependency-path: backend/go.sum
      - name: Download Go modules
        run: go mod download
      - name: Run backend tests
        run: go test -race -count=1 -timeout=120s -v ./...

  postgres:
    name: PostgreSQL / end to end
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CGO_ENABLED: "1"
      SQLFLICK_E2E_PG_HOST: 127.0.0.1
      SQLFLICK_E2E_PG_PORT: "5432"
      SQLFLICK_E2E_PG_DATABASE: test_db
      SQLFLICK_E2E_PG_USER: test_user
      SQLFLICK_E2E_PG_PASSWORD: test_password
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential curl git make
      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
          cache-dependency-path: backend/go.sum
      - name: Install Neovim
        uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        with:
          neovim: true
          version: stable
      - name: Install Plenary
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: nvim-lua/plenary.nvim
          ref: 74b06c6c75e4eeb3108ec01852001636d85a932b
          path: .deps/plenary.nvim
          persist-credentials: false
      - name: Download Go modules
        working-directory: backend
        run: go mod download
      - name: Run PostgreSQL end-to-end tests
        run: make test-e2e
      - name: Show PostgreSQL logs on failure
        if: failure()
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: docker logs "$POSTGRES_CONTAINER"
